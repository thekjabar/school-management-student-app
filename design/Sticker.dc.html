<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    a { color: #E11D48; text-decoration: none; }
    a:hover { color: #BE123C; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFF4E0; font-family: 'Baloo 2', 'Trebuchet MS', sans-serif; color: #2B1B12; display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <!-- Confetti shapes scattered behind the stickers -->
  <div style="position: absolute; top: 120px; right: 22px; width: 10px; height: 10px; background: #FBBF24; border-radius: 2px; transform: rotate(24deg);"></div>
  <div style="position: absolute; top: 300px; left: 12px; width: 8px; height: 8px; background: #34D399; border-radius: 999px;"></div>
  <div style="position: absolute; top: 470px; right: 14px; width: 12px; height: 5px; background: #60A5FA; border-radius: 3px; transform: rotate(-18deg);"></div>

  <!-- Header sticker strip -->
  <div style="padding: 22px 18px 0 18px; display: flex; align-items: center; gap: 11px; position: relative;">
    <!-- Avatar as a peeling sticker: white keyline + hard shadow -->
    <div style="width: 52px; height: 52px; border-radius: 16px; background: #F472B6; border: 3.5px solid #FFFFFF; box-shadow: 0 3px 0 rgba(43,27,18,0.28); display: flex; align-items: center; justify-content: center; transform: rotate(-4deg); flex-shrink: 0;">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="9" r="4.2" fill="#2B1B12"/>
        <path d="M4.5 20.5a7.5 7.5 0 0115 0z" fill="#2B1B12"/>
      </svg>
    </div>
    <div style="flex: 1;">
      <div style="font-size: 19px; font-weight: 700; letter-spacing: -0.3px; line-height: 1.15;">Rawand Karwan</div>
      <div style="font-size: 12.5px; font-weight: 500; color: #8A6B57;">Grade 11-B · No. 8821</div>
    </div>
    <div style="background: #FBBF24; border: 3px solid #FFFFFF; border-radius: 999px; padding: 4px 11px; box-shadow: 0 3px 0 rgba(43,27,18,0.28); transform: rotate(5deg);">
      <div style="font-size: 12px; font-weight: 800; color: #2B1B12;">12 DAYS</div>
    </div>
  </div>

  <div style="flex: 1; overflow: hidden; padding: 18px 18px 0 18px; display: flex; flex-direction: column; gap: 13px; position: relative;">

    <!-- Now: a big tilted sticker card -->
    <div style="background: #E11D48; border: 4px solid #FFFFFF; border-radius: 24px; padding: 17px 18px 19px 18px; box-shadow: 0 5px 0 rgba(43,27,18,0.3); transform: rotate(-1.2deg);">
      <div style="display: inline-flex; align-items: center; gap: 6px; background: #FFFFFF; border-radius: 999px; padding: 3px 10px; margin-bottom: 12px;">
        <div style="width: 7px; height: 7px; border-radius: 999px; background: #16A34A;"></div>
        <div style="font-size: 11.5px; font-weight: 700; color: #2B1B12;">IN CLASS NOW</div>
      </div>
      <div style="font-size: 27px; font-weight: 800; color: #FFFFFF; line-height: 1.06; letter-spacing: -0.6px; margin-bottom: 7px;">Advanced<br>Mathematics</div>
      <div style="font-size: 13.5px; font-weight: 500; color: #FFD7DF;">Room 402 · until 09:30</div>
    </div>

    <!-- Two badge-style scores -->
    <div style="display: flex; gap: 11px;">
      <div style="flex: 1; background: #34D399; border: 4px solid #FFFFFF; border-radius: 22px; padding: 14px 15px 16px 15px; box-shadow: 0 4px 0 rgba(43,27,18,0.3); transform: rotate(1deg);">
        <div style="font-size: 11.5px; font-weight: 700; color: #05432B; margin-bottom: 5px;">ATTENDANCE</div>
        <div style="display: flex; align-items: baseline; gap: 1px;">
          <span style="font-size: 32px; font-weight: 800; color: #FFFFFF; line-height: 1;">92</span>
          <span style="font-size: 16px; font-weight: 700; color: #D6FBE9;">%</span>
        </div>
      </div>
      <div style="flex: 1; background: #6366F1; border: 4px solid #FFFFFF; border-radius: 22px; padding: 14px 15px 16px 15px; box-shadow: 0 4px 0 rgba(43,27,18,0.3); transform: rotate(-1.4deg);">
        <div style="font-size: 11.5px; font-weight: 700; color: #C7D2FE; margin-bottom: 5px;">AVERAGE</div>
        <div style="font-size: 32px; font-weight: 800; color: #FFFFFF; line-height: 1;">3.85</div>
      </div>
    </div>

    <!-- To-do stickers -->
    <div>
      <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 10px; padding: 0 2px;">
        <div style="font-size: 17px; font-weight: 700; letter-spacing: -0.3px;">To hand in</div>
        <div style="background: #2B1B12; border-radius: 999px; padding: 1px 8px; font-size: 11.5px; font-weight: 700; color: #FFF4E0;">2</div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px;">
        <div style="background: #FFFFFF; border: 3.5px solid #2B1B12; border-radius: 20px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; min-height: 44px; box-shadow: 0 4px 0 #2B1B12;">
          <div style="width: 42px; height: 42px; border-radius: 14px; background: #60A5FA; display: flex; align-items: center; justify-content: center; flex-shrink: 0; border: 2.5px solid #2B1B12;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M9.5 3v6L5 18.5A2 2 0 006.8 21.5h10.4A2 2 0 0019 18.5L14.5 9V3" stroke="#FFFFFF" stroke-width="2.4" stroke-linejoin="round"/><path d="M8 3h8" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/></svg>
          </div>
          <div style="flex: 1;">
            <div style="font-size: 15px; font-weight: 600; letter-spacing: -0.2px; line-height: 1.25;">Chemistry Lab Report</div>
            <div style="font-size: 12.5px; font-weight: 600; color: #E11D48;">TODAY · 23:59</div>
          </div>
        </div>

        <div style="background: #FFFFFF; border: 3.5px solid #2B1B12; border-radius: 20px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; min-height: 44px; box-shadow: 0 4px 0 #2B1B12;">
          <div style="width: 42px; height: 42px; border-radius: 14px; background: #F472B6; display: flex; align-items: center; justify-content: center; flex-shrink: 0; border: 2.5px solid #2B1B12;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M3 17.5L14 6.5l3.5 3.5L6.5 21H3z" stroke="#FFFFFF" stroke-width="2.4" stroke-linejoin="round"/><path d="M14.5 5l2-2 3.5 3.5-2 2" stroke="#FFFFFF" stroke-width="2.4" stroke-linejoin="round"/></svg>
          </div>
          <div style="flex: 1;">
            <div style="font-size: 15px; font-weight: 600; letter-spacing: -0.2px; line-height: 1.25;">Digital Art Portfolio</div>
            <div style="font-size: 12.5px; font-weight: 500; color: #8A6B57;">Wednesday · 10:00</div>
          </div>
        </div>
      </div>
    </div>

    <div style="flex: 1;"></div>

    <!-- Shortcut stickers, each rotated a touch so they read as stuck on -->
    <div style="display: flex; gap: 9px; padding-bottom: 14px; justify-content: space-between;">
      <div style="flex: 1; background: #A78BFA; border: 3px solid #FFFFFF; border-radius: 18px; padding: 11px 4px 10px 4px; display: flex; flex-direction: column; align-items: center; gap: 5px; min-height: 44px; box-shadow: 0 3px 0 rgba(43,27,18,0.28); transform: rotate(-2deg);">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><path d="M4 5a2 2 0 012-2h13v18H6a2 2 0 01-2-2z" stroke="#FFFFFF" stroke-width="2.3" stroke-linejoin="round"/><path d="M4 19a2 2 0 012-2h13" stroke="#FFFFFF" stroke-width="2.3"/></svg>
        <div style="font-size: 10px; font-weight: 600; color: #FFFFFF;">Library</div>
      </div>
      <div style="flex: 1; background: #FBBF24; border: 3px solid #FFFFFF; border-radius: 18px; padding: 11px 4px 10px 4px; display: flex; flex-direction: column; align-items: center; gap: 5px; min-height: 44px; box-shadow: 0 3px 0 rgba(43,27,18,0.28); transform: rotate(1.6deg);">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><rect x="3.5" y="5.5" width="17" height="15" rx="3" stroke="#2B1B12" stroke-width="2.3"/><path d="M3.5 10.5h17M8 3v4M16 3v4" stroke="#2B1B12" stroke-width="2.3" stroke-linecap="round"/></svg>
        <div style="font-size: 10px; font-weight: 600; color: #2B1B12;">Exams</div>
      </div>
      <div style="flex: 1; background: #34D399; border: 3px solid #FFFFFF; border-radius: 18px; padding: 11px 4px 10px 4px; display: flex; flex-direction: column; align-items: center; gap: 5px; min-height: 44px; box-shadow: 0 3px 0 rgba(43,27,18,0.28); transform: rotate(-1.2deg);">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><path d="M20.5 11.5a8 8 0 01-8.5 8L4 21l1-8a8 8 0 1115.5-1.5z" stroke="#FFFFFF" stroke-width="2.3" stroke-linejoin="round"/></svg>
        <div style="font-size: 10px; font-weight: 600; color: #FFFFFF;">Hub</div>
      </div>
      <div style="flex: 1; background: #FB7185; border: 3px solid #FFFFFF; border-radius: 18px; padding: 11px 4px 10px 4px; display: flex; flex-direction: column; align-items: center; gap: 5px; min-height: 44px; box-shadow: 0 3px 0 rgba(43,27,18,0.28); transform: rotate(2.2deg);">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><rect x="4" y="3.5" width="16" height="13.5" rx="3" stroke="#FFFFFF" stroke-width="2.3"/><path d="M4 10.5h16M7.5 21v-2.5M16.5 21v-2.5" stroke="#FFFFFF" stroke-width="2.3" stroke-linecap="round"/></svg>
        <div style="font-size: 10px; font-weight: 600; color: #FFFFFF;">Bus</div>
      </div>
    </div>
  </div>

  <!-- Tab bar: a dark strip so the stickers above it pop -->
  <div style="background: #2B1B12; display: flex; padding: 8px 10px 14px 10px; gap: 5px;">
    <div style="flex: 1; min-height: 46px; border-radius: 15px; background: #FBBF24; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M3 8l9-4.5L21 8l-9 4.5z" fill="#2B1B12"/><path d="M6.5 11v4.5c0 1.6 2.5 2.8 5.5 2.8s5.5-1.2 5.5-2.8V11" stroke="#2B1B12" stroke-width="2.3" stroke-linecap="round"/></svg>
      <div style="font-size: 9.5px; font-weight: 700; color: #2B1B12;">Learn</div>
    </div>
    <div style="flex: 1; min-height: 46px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><rect x="3.5" y="5.5" width="17" height="15" rx="3" stroke="#9C8578" stroke-width="2.3"/><path d="M3.5 10.5h17M8 3v4M16 3v4" stroke="#9C8578" stroke-width="2.3" stroke-linecap="round"/></svg>
      <div style="font-size: 9.5px; font-weight: 500; color: #9C8578;">Schedule</div>
    </div>
    <div style="flex: 1; min-height: 46px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M12 3l2.6 5.9 6.4.6-4.8 4.3 1.4 6.3L12 16.9 6.4 20.1l1.4-6.3L3 9.5l6.4-.6z" stroke="#9C8578" stroke-width="2.3" stroke-linejoin="round"/></svg>
      <div style="font-size: 9.5px; font-weight: 500; color: #9C8578;">Grades</div>
    </div>
    <div style="flex: 1; min-height: 46px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8.5" r="3.6" stroke="#9C8578" stroke-width="2.3"/><path d="M5 20a7 7 0 0114 0" stroke="#9C8578" stroke-width="2.3" stroke-linecap="round"/></svg>
      <div style="font-size: 9.5px; font-weight: 500; color: #9C8578;">Account</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
