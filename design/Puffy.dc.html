<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #7C3AED; text-decoration: none; }
    a:hover { color: #6D28D9; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(180deg, #F3EBFF 0%, #EAF3FF 60%, #FFF1F6 100%); font-family: Quicksand, 'Trebuchet MS', sans-serif; color: #382A4D; display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <!-- Soft blobs, blurred, giving depth without a photograph -->
  <div style="position: absolute; top: -46px; right: -34px; width: 180px; height: 180px; border-radius: 999px; background: #D8C4FF; filter: blur(26px); opacity: 0.75;"></div>
  <div style="position: absolute; bottom: 130px; left: -50px; width: 160px; height: 160px; border-radius: 999px; background: #FFD6E7; filter: blur(28px); opacity: 0.7;"></div>

  <div style="position: relative; padding: 26px 18px 0 18px; display: flex; align-items: center; gap: 12px;">
    <!-- A puffy character: rounded body, soft highlight, no outline at all -->
    <div style="width: 58px; height: 58px; border-radius: 22px; background: linear-gradient(160deg, #C4A0FF, #9B6DFF); box-shadow: 0 8px 18px rgba(124,58,237,0.32), inset 0 -4px 8px rgba(80,30,160,0.25), inset 0 4px 8px rgba(255,255,255,0.5); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="34" height="34" viewBox="0 0 34 34" fill="none">
        <circle cx="12" cy="14" r="4" fill="#FFFFFF"/>
        <circle cx="23" cy="14" r="4" fill="#FFFFFF"/>
        <circle cx="12.8" cy="14.8" r="2" fill="#3B1F70"/>
        <circle cx="22.2" cy="14.8" r="2" fill="#3B1F70"/>
        <path d="M13 22c1.4 1.6 4.6 1.6 6 0" stroke="#3B1F70" stroke-width="2.2" stroke-linecap="round"/>
        <ellipse cx="7" cy="19.5" rx="2.6" ry="1.8" fill="#FF9BC2" opacity="0.75"/>
        <ellipse cx="27.5" cy="19.5" rx="2.6" ry="1.8" fill="#FF9BC2" opacity="0.75"/>
      </svg>
    </div>
    <div style="flex: 1;">
      <div style="font-size: 13px; font-weight: 500; color: #7C6B93;">Good morning</div>
      <div style="font-size: 20px; font-weight: 700; letter-spacing: -0.4px; line-height: 1.15;">Rawand</div>
    </div>
    <div style="background: rgba(255,255,255,0.75); border-radius: 18px; padding: 8px 12px; box-shadow: 0 5px 14px rgba(56,42,77,0.10); backdrop-filter: blur(6px);">
      <div style="font-size: 11px; font-weight: 600; color: #7C6B93;">Streak</div>
      <div style="font-size: 16px; font-weight: 700; color: #7C3AED; line-height: 1.1;">12</div>
    </div>
  </div>

  <div style="flex: 1; overflow: hidden; padding: 18px 18px 0 18px; display: flex; flex-direction: column; gap: 13px; position: relative;">

    <!-- Now: a pillow of a card -->
    <div style="background: linear-gradient(150deg, #8B5CF6, #6D3FE0); border-radius: 30px; padding: 20px 20px 22px 20px; box-shadow: 0 14px 30px rgba(109,63,224,0.35), inset 0 2px 6px rgba(255,255,255,0.28);">
      <div style="display: inline-flex; align-items: center; gap: 7px; background: rgba(255,255,255,0.22); border-radius: 999px; padding: 5px 12px; margin-bottom: 14px;">
        <div style="width: 7px; height: 7px; border-radius: 999px; background: #6EE7B7; box-shadow: 0 0 8px #6EE7B7;"></div>
        <div style="font-size: 11.5px; font-weight: 600; color: #FFFFFF;">Happening now</div>
      </div>
      <div style="font-size: 25px; font-weight: 700; color: #FFFFFF; line-height: 1.12; letter-spacing: -0.5px; margin-bottom: 7px;">Advanced<br>Mathematics</div>
      <div style="font-size: 13.5px; font-weight: 500; color: #DCCDFF;">Room 402 · ends 09:30</div>
    </div>

    <!-- Two soft pill stats -->
    <div style="display: flex; gap: 12px;">
      <div style="flex: 1; background: rgba(255,255,255,0.8); border-radius: 26px; padding: 16px 16px 18px 16px; box-shadow: 0 8px 20px rgba(56,42,77,0.09); backdrop-filter: blur(8px);">
        <div style="font-size: 11.5px; font-weight: 600; color: #7C6B93; margin-bottom: 9px;">Attendance</div>
        <div style="display: flex; align-items: baseline; gap: 2px; margin-bottom: 9px;">
          <span style="font-size: 29px; font-weight: 700; color: #16A075; line-height: 1;">92</span>
          <span style="font-size: 15px; font-weight: 600; color: #6BBBA0;">%</span>
        </div>
        <div style="height: 7px; border-radius: 999px; background: #E4E0EE; overflow: hidden;">
          <div style="width: 92%; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #6EE7B7, #16A075);"></div>
        </div>
      </div>
      <div style="flex: 1; background: rgba(255,255,255,0.8); border-radius: 26px; padding: 16px 16px 18px 16px; box-shadow: 0 8px 20px rgba(56,42,77,0.09); backdrop-filter: blur(8px);">
        <div style="font-size: 11.5px; font-weight: 600; color: #7C6B93; margin-bottom: 9px;">Average</div>
        <div style="font-size: 29px; font-weight: 700; color: #E0518F; line-height: 1; margin-bottom: 9px;">3.85</div>
        <div style="height: 7px; border-radius: 999px; background: #E4E0EE; overflow: hidden;">
          <div style="width: 96%; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #FFB3D1, #E0518F);"></div>
        </div>
      </div>
    </div>

    <!-- Tasks as soft rows -->
    <div>
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; padding: 0 4px;">
        <div style="font-size: 15.5px; font-weight: 700; letter-spacing: -0.3px;">To do</div>
        <div style="font-size: 12px; font-weight: 600; color: #7C3AED;">2 left</div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px;">
        <div style="background: rgba(255,255,255,0.85); border-radius: 24px; padding: 13px 15px; display: flex; align-items: center; gap: 13px; min-height: 44px; box-shadow: 0 6px 16px rgba(56,42,77,0.08);">
          <div style="width: 44px; height: 44px; border-radius: 17px; background: linear-gradient(150deg, #7DD3FC, #3B9FE0); box-shadow: inset 0 -3px 6px rgba(20,80,130,0.3), inset 0 3px 6px rgba(255,255,255,0.5); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M9.5 3v6L5 18.5A2 2 0 006.8 21.5h10.4A2 2 0 0019 18.5L14.5 9V3" stroke="#FFFFFF" stroke-width="2.2" stroke-linejoin="round"/><path d="M8 3h8" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/></svg>
          </div>
          <div style="flex: 1;">
            <div style="font-size: 14.5px; font-weight: 600; letter-spacing: -0.2px; margin-bottom: 2px;">Chemistry Lab Report</div>
            <div style="font-size: 12px; font-weight: 600; color: #E0518F;">Today, 23:59</div>
          </div>
        </div>

        <div style="background: rgba(255,255,255,0.85); border-radius: 24px; padding: 13px 15px; display: flex; align-items: center; gap: 13px; min-height: 44px; box-shadow: 0 6px 16px rgba(56,42,77,0.08);">
          <div style="width: 44px; height: 44px; border-radius: 17px; background: linear-gradient(150deg, #FDA4D3, #E0518F); box-shadow: inset 0 -3px 6px rgba(150,25,90,0.3), inset 0 3px 6px rgba(255,255,255,0.45); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M3 17.5L14 6.5l3.5 3.5L6.5 21H3z" stroke="#FFFFFF" stroke-width="2.2" stroke-linejoin="round"/><path d="M14.5 5l2-2 3.5 3.5-2 2" stroke="#FFFFFF" stroke-width="2.2" stroke-linejoin="round"/></svg>
          </div>
          <div style="flex: 1;">
            <div style="font-size: 14.5px; font-weight: 600; letter-spacing: -0.2px; margin-bottom: 2px;">Digital Art Portfolio</div>
            <div style="font-size: 12px; font-weight: 500; color: #7C6B93;">Wednesday, 10:00</div>
          </div>
        </div>
      </div>
    </div>

    <div style="flex: 1;"></div>

    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; padding-bottom: 14px;">
      <div style="background: rgba(255,255,255,0.8); border-radius: 20px; padding: 12px 4px; display: flex; flex-direction: column; align-items: center; gap: 6px; min-height: 44px; box-shadow: 0 6px 14px rgba(56,42,77,0.08);">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><path d="M4 5a2 2 0 012-2h13v18H6a2 2 0 01-2-2z" stroke="#8B5CF6" stroke-width="2" stroke-linejoin="round"/><path d="M4 19a2 2 0 012-2h13" stroke="#8B5CF6" stroke-width="2"/></svg>
        <div style="font-size: 10px; font-weight: 600; color: #6B5C85;">Library</div>
      </div>
      <div style="background: rgba(255,255,255,0.8); border-radius: 20px; padding: 12px 4px; display: flex; flex-direction: column; align-items: center; gap: 6px; min-height: 44px; box-shadow: 0 6px 14px rgba(56,42,77,0.08);">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><rect x="3.5" y="5.5" width="17" height="15" rx="4" stroke="#F59E0B" stroke-width="2"/><path d="M3.5 10.5h17M8 3v4M16 3v4" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/></svg>
        <div style="font-size: 10px; font-weight: 600; color: #6B5C85;">Exams</div>
      </div>
      <div style="background: rgba(255,255,255,0.8); border-radius: 20px; padding: 12px 4px; display: flex; flex-direction: column; align-items: center; gap: 6px; min-height: 44px; box-shadow: 0 6px 14px rgba(56,42,77,0.08);">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><path d="M20.5 11.5a8 8 0 01-8.5 8L4 21l1-8a8 8 0 1115.5-1.5z" stroke="#14B8A6" stroke-width="2" stroke-linejoin="round"/></svg>
        <div style="font-size: 10px; font-weight: 600; color: #6B5C85;">Hub</div>
      </div>
      <div style="background: rgba(255,255,255,0.8); border-radius: 20px; padding: 12px 4px; display: flex; flex-direction: column; align-items: center; gap: 6px; min-height: 44px; box-shadow: 0 6px 14px rgba(56,42,77,0.08);">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><rect x="4" y="3.5" width="16" height="13.5" rx="4" stroke="#E0518F" stroke-width="2"/><path d="M4 10.5h16M7.5 21v-2.5M16.5 21v-2.5" stroke="#E0518F" stroke-width="2" stroke-linecap="round"/></svg>
        <div style="font-size: 10px; font-weight: 600; color: #6B5C85;">Bus</div>
      </div>
    </div>
  </div>

  <!-- Floating pill tab bar -->
  <div style="padding: 0 16px 18px 16px; position: relative;">
    <div style="background: rgba(255,255,255,0.92); border-radius: 28px; padding: 7px; display: flex; box-shadow: 0 12px 28px rgba(56,42,77,0.16); backdrop-filter: blur(10px);">
      <div style="flex: 1; min-height: 48px; border-radius: 22px; background: linear-gradient(150deg, #8B5CF6, #6D3FE0); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; box-shadow: 0 5px 12px rgba(109,63,224,0.4);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 8l9-4.5L21 8l-9 4.5z" fill="#FFFFFF"/><path d="M6.5 11v4.5c0 1.6 2.5 2.8 5.5 2.8s5.5-1.2 5.5-2.8V11" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/></svg>
        <div style="font-size: 9.5px; font-weight: 700; color: #FFFFFF;">Learn</div>
      </div>
      <div style="flex: 1; min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="3.5" y="5.5" width="17" height="15" rx="4" stroke="#B0A5C4" stroke-width="2"/><path d="M3.5 10.5h17M8 3v4M16 3v4" stroke="#B0A5C4" stroke-width="2" stroke-linecap="round"/></svg>
        <div style="font-size: 9.5px; font-weight: 600; color: #B0A5C4;">Schedule</div>
      </div>
      <div style="flex: 1; min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 3l2.6 5.9 6.4.6-4.8 4.3 1.4 6.3L12 16.9 6.4 20.1l1.4-6.3L3 9.5l6.4-.6z" stroke="#B0A5C4" stroke-width="2" stroke-linejoin="round"/></svg>
        <div style="font-size: 9.5px; font-weight: 600; color: #B0A5C4;">Grades</div>
      </div>
      <div style="flex: 1; min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8.5" r="3.6" stroke="#B0A5C4" stroke-width="2"/><path d="M5 20a7 7 0 0114 0" stroke="#B0A5C4" stroke-width="2" stroke-linecap="round"/></svg>
        <div style="font-size: 9.5px; font-weight: 600; color: #B0A5C4;">Account</div>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
