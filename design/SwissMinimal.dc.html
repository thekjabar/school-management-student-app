<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #E10600; text-decoration: none; }
    a:hover { color: #B30500; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: Archivo, 'Helvetica Neue', Helvetica, sans-serif; color: #0A0A0A; display: flex; flex-direction: column; overflow: hidden;">

  <!-- Header: index-card discipline, everything on the baseline grid -->
  <div style="border-bottom: 1px solid #0A0A0A; padding: 24px 20px 10px 20px; display: flex; align-items: flex-end; justify-content: space-between;">
    <div>
      <div style="font-size: 9px; letter-spacing: 1.6px; text-transform: uppercase; color: #9B9B9B; margin-bottom: 5px;">Student</div>
      <div style="font-size: 15px; font-weight: 600; letter-spacing: -0.2px; line-height: 1;">Rawand Karwan</div>
    </div>
    <div style="text-align: right;">
      <div style="font-size: 9px; letter-spacing: 1.6px; text-transform: uppercase; color: #9B9B9B; margin-bottom: 5px;">ID</div>
      <div style="font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums; line-height: 1;">8821</div>
    </div>
  </div>

  <div style="flex: 1; overflow: hidden; display: flex; flex-direction: column;">

    <!-- Now. A single red rule is the only colour on the screen. -->
    <div style="padding: 16px 20px 16px 20px; border-bottom: 1px solid #E5E5E5;">
      <div style="display: flex; gap: 10px; align-items: baseline; margin-bottom: 9px;">
        <div style="width: 22px; height: 2px; background: #E10600; align-self: center;"></div>
        <div style="font-size: 9px; letter-spacing: 1.6px; text-transform: uppercase; font-weight: 600;">Period 1 · Now</div>
        <div style="flex: 1;"></div>
        <div style="font-size: 11px; color: #6B6B6B; font-variant-numeric: tabular-nums;">08.00–09.30</div>
      </div>
      <div style="font-size: 22px; font-weight: 600; letter-spacing: -0.7px; line-height: 1.1; margin-bottom: 5px;">Advanced Mathematics</div>
      <div style="font-size: 11.5px; color: #6B6B6B; letter-spacing: 0.1px;">402 / Feynman</div>
    </div>

    <!-- Figures in a hard four-column grid, the numbers doing all the work -->
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-bottom: 1px solid #0A0A0A;">
      <div style="padding: 14px 20px 15px 20px; border-right: 1px solid #E5E5E5;">
        <div style="font-size: 9px; letter-spacing: 1.6px; text-transform: uppercase; color: #9B9B9B; margin-bottom: 8px;">Attendance</div>
        <div style="display: flex; align-items: baseline; gap: 2px;">
          <span style="font-size: 34px; font-weight: 600; letter-spacing: -1.6px; line-height: 0.9; font-variant-numeric: tabular-nums;">92</span>
          <span style="font-size: 13px; font-weight: 500; color: #9B9B9B;">%</span>
        </div>
      </div>
      <div style="padding: 14px 20px 15px 20px;">
        <div style="font-size: 9px; letter-spacing: 1.6px; text-transform: uppercase; color: #9B9B9B; margin-bottom: 8px;">GPA</div>
        <div style="font-size: 34px; font-weight: 600; letter-spacing: -1.6px; line-height: 0.9; font-variant-numeric: tabular-nums;">3.85</div>
      </div>
    </div>

    <!-- Assignments as a ledger: numbered, ruled, dates right-aligned -->
    <div style="padding: 15px 20px 0 20px;">
      <div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 11px;">
        <div style="font-size: 9px; letter-spacing: 1.6px; text-transform: uppercase; font-weight: 600;">Assignments</div>
        <div style="font-size: 9px; letter-spacing: 1.6px; text-transform: uppercase; color: #9B9B9B;">02 open</div>
      </div>

      <div style="display: flex; align-items: baseline; gap: 12px; padding: 11px 0; border-top: 1px solid #E5E5E5; min-height: 44px;">
        <div style="font-size: 10px; color: #9B9B9B; font-variant-numeric: tabular-nums; width: 16px;">01</div>
        <div style="flex: 1; font-size: 13.5px; font-weight: 500; letter-spacing: -0.1px;">Chemistry Lab Report</div>
        <div style="font-size: 10.5px; color: #E10600; font-weight: 600; letter-spacing: 0.2px;">TODAY</div>
      </div>
      <div style="display: flex; align-items: baseline; gap: 12px; padding: 11px 0; border-top: 1px solid #E5E5E5; border-bottom: 1px solid #E5E5E5; min-height: 44px;">
        <div style="font-size: 10px; color: #9B9B9B; font-variant-numeric: tabular-nums; width: 16px;">02</div>
        <div style="flex: 1; font-size: 13.5px; font-weight: 500; letter-spacing: -0.1px;">Digital Art Portfolio</div>
        <div style="font-size: 10.5px; color: #6B6B6B; font-variant-numeric: tabular-nums;">01.10</div>
      </div>
    </div>

    <div style="flex: 1;"></div>

    <!-- Links as a lettered index, no icons at all -->
    <div style="padding: 0 20px 18px 20px;">
      <div style="font-size: 9px; letter-spacing: 1.6px; text-transform: uppercase; font-weight: 600; padding-bottom: 10px; border-bottom: 1px solid #0A0A0A;">Index</div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));">
        <a href="#" style="display: flex; align-items: center; gap: 9px; min-height: 44px; border-bottom: 1px solid #E5E5E5; font-size: 12.5px; color: #0A0A0A; letter-spacing: -0.1px;">
          <span style="font-size: 9.5px; color: #9B9B9B; font-variant-numeric: tabular-nums;">A</span> Digital Library
        </a>
        <a href="#" style="display: flex; align-items: center; gap: 9px; min-height: 44px; border-bottom: 1px solid #E5E5E5; padding-left: 16px; font-size: 12.5px; color: #0A0A0A; letter-spacing: -0.1px;">
          <span style="font-size: 9.5px; color: #9B9B9B; font-variant-numeric: tabular-nums;">B</span> Exam Schedule
        </a>
        <a href="#" style="display: flex; align-items: center; gap: 9px; min-height: 44px; border-bottom: 1px solid #E5E5E5; font-size: 12.5px; color: #0A0A0A; letter-spacing: -0.1px;">
          <span style="font-size: 9.5px; color: #9B9B9B; font-variant-numeric: tabular-nums;">C</span> Student Hub
        </a>
        <a href="#" style="display: flex; align-items: center; gap: 9px; min-height: 44px; border-bottom: 1px solid #E5E5E5; padding-left: 16px; font-size: 12.5px; color: #0A0A0A; letter-spacing: -0.1px;">
          <span style="font-size: 9.5px; color: #9B9B9B; font-variant-numeric: tabular-nums;">D</span> Bus Tracker
        </a>
      </div>
    </div>
  </div>

  <!-- Tabs: type only, the active one marked by a red rule above it -->
  <div style="display: flex; border-top: 1px solid #0A0A0A;">
    <div style="flex: 1; min-height: 56px; display: flex; align-items: center; justify-content: center; border-top: 3px solid #E10600; margin-top: -1px; font-size: 10px; letter-spacing: 1.2px; text-transform: uppercase; font-weight: 600;">Learn</div>
    <div style="flex: 1; min-height: 56px; display: flex; align-items: center; justify-content: center; font-size: 10px; letter-spacing: 1.2px; text-transform: uppercase; color: #9B9B9B;">Sched</div>
    <div style="flex: 1; min-height: 56px; display: flex; align-items: center; justify-content: center; font-size: 10px; letter-spacing: 1.2px; text-transform: uppercase; color: #9B9B9B;">Grades</div>
    <div style="flex: 1; min-height: 56px; display: flex; align-items: center; justify-content: center; font-size: 10px; letter-spacing: 1.2px; text-transform: uppercase; color: #9B9B9B;">Account</div>
  </div>
</div>
</x-dc>
</body>
</html>
