<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #C2410C; text-decoration: none; }
    a:hover { color: #9A3412; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FDF7F0; font-family: Outfit, 'Avenir Next', 'Segoe UI', sans-serif; color: #2E2823; display: flex; flex-direction: column; overflow: hidden;">

  <div style="flex: 1; overflow: hidden; padding: 26px 18px 0 18px; display: flex; flex-direction: column; gap: 14px;">

    <!-- Greeting rather than a data header -->
    <div style="display: flex; align-items: center; gap: 12px;">
      <div style="width: 46px; height: 46px; border-radius: 16px; background: #FFE0C7; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; color: #C2410C;">RK</div>
      <div style="flex: 1;">
        <div style="font-size: 13px; color: #8C8177; font-weight: 400;">Good morning,</div>
        <div style="font-size: 19px; font-weight: 600; letter-spacing: -0.3px; line-height: 1.2;">Rawand</div>
      </div>
      <div style="min-width: 44px; min-height: 44px; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 3px rgba(46,40,35,0.06);">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#6E635A" stroke-width="1.6" stroke-linecap="round"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>
      </div>
    </div>

    <!-- The lesson, as a warm hero card -->
    <div style="background: #FFE0C7; border-radius: 26px; padding: 20px 20px 22px 20px;">
      <div style="display: flex; align-items: center; gap: 6px; margin-bottom: 14px;">
        <div style="width: 7px; height: 7px; border-radius: 999px; background: #16A34A;"></div>
        <div style="font-size: 11.5px; font-weight: 600; color: #B45309; letter-spacing: 0.3px;">In class now</div>
        <div style="flex: 1;"></div>
        <div style="font-size: 11.5px; color: #A6785C;">until 09:30</div>
      </div>
      <div style="font-size: 23px; font-weight: 600; letter-spacing: -0.5px; line-height: 1.18; margin-bottom: 6px; color: #4A2C14;">Advanced Mathematics</div>
      <div style="font-size: 13.5px; color: #916B4E;">Room 402 · Prof. Feynman</div>
    </div>

    <!-- Two soft stat cards -->
    <div style="display: flex; gap: 12px;">
      <div style="flex: 1; background: #DFF3E6; border-radius: 22px; padding: 16px 16px 18px 16px;">
        <div style="font-size: 11.5px; color: #3F7A56; font-weight: 500; margin-bottom: 10px;">Attendance</div>
        <div style="display: flex; align-items: baseline; gap: 2px;">
          <span style="font-size: 30px; font-weight: 600; letter-spacing: -1px; color: #1B5E3A; line-height: 1;">92</span>
          <span style="font-size: 15px; font-weight: 500; color: #4F8A67;">%</span>
        </div>
      </div>
      <div style="flex: 1; background: #E4E0FB; border-radius: 22px; padding: 16px 16px 18px 16px;">
        <div style="font-size: 11.5px; color: #5B52A3; font-weight: 500; margin-bottom: 10px;">Grade average</div>
        <div style="font-size: 30px; font-weight: 600; letter-spacing: -1px; color: #3C3480; line-height: 1;">3.85</div>
      </div>
    </div>

    <!-- Assignments -->
    <div>
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; padding: 0 4px;">
        <div style="font-size: 14.5px; font-weight: 600; letter-spacing: -0.2px;">To hand in</div>
        <div style="font-size: 12px; color: #C2410C; font-weight: 500;">2 left</div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px;">
        <div style="background: #FFFFFF; border-radius: 20px; padding: 14px; display: flex; align-items: center; gap: 13px; min-height: 44px; box-shadow: 0 1px 3px rgba(46,40,35,0.05);">
          <div style="width: 42px; height: 42px; border-radius: 15px; background: #DBEEFB; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3v6.5L4.5 18a2 2 0 001.8 3h11.4a2 2 0 001.8-3L15 9.5V3"/><path d="M8 3h8"/></svg>
          </div>
          <div style="flex: 1;">
            <div style="font-size: 14.5px; font-weight: 500; letter-spacing: -0.2px; margin-bottom: 2px;">Chemistry Lab Report</div>
            <div style="font-size: 12px; color: #C2410C; font-weight: 500;">Today, 23:59</div>
          </div>
        </div>

        <div style="background: #FFFFFF; border-radius: 20px; padding: 14px; display: flex; align-items: center; gap: 13px; min-height: 44px; box-shadow: 0 1px 3px rgba(46,40,35,0.05);">
          <div style="width: 42px; height: 42px; border-radius: 15px; background: #FBE2F0; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#DB2777" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="8.5" cy="10" r="1.2"/><circle cx="15.5" cy="10" r="1.2"/><path d="M12 21a3 3 0 003-3 2 2 0 00-2-2h-1"/></svg>
          </div>
          <div style="flex: 1;">
            <div style="font-size: 14.5px; font-weight: 500; letter-spacing: -0.2px; margin-bottom: 2px;">Digital Art Portfolio</div>
            <div style="font-size: 12px; color: #8C8177;">Wednesday, 10:00</div>
          </div>
        </div>
      </div>
    </div>

    <div style="flex: 1;"></div>

    <!-- Quick links as soft pastel squares -->
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 9px; padding-bottom: 14px;">
      <div style="background: #FFFFFF; border-radius: 18px; padding: 12px 6px; display: flex; flex-direction: column; align-items: center; gap: 7px; min-height: 44px; box-shadow: 0 1px 3px rgba(46,40,35,0.05);">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7C3AED" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5A2.5 2.5 0 016.5 2H20v20H6.5A2.5 2.5 0 014 19.5z"/><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/></svg>
        <div style="font-size: 10px; color: #6E635A; text-align: center; line-height: 1.2;">Library</div>
      </div>
      <div style="background: #FFFFFF; border-radius: 18px; padding: 12px 6px; display: flex; flex-direction: column; align-items: center; gap: 7px; min-height: 44px; box-shadow: 0 1px 3px rgba(46,40,35,0.05);">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#EA580C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <div style="font-size: 10px; color: #6E635A; text-align: center; line-height: 1.2;">Exams</div>
      </div>
      <div style="background: #FFFFFF; border-radius: 18px; padding: 12px 6px; display: flex; flex-direction: column; align-items: center; gap: 7px; min-height: 44px; box-shadow: 0 1px 3px rgba(46,40,35,0.05);">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0D9488" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 01-9 8.4L3 21l1.1-9A8.4 8.4 0 1121 11.5z"/></svg>
        <div style="font-size: 10px; color: #6E635A; text-align: center; line-height: 1.2;">Hub</div>
      </div>
      <div style="background: #FFFFFF; border-radius: 18px; padding: 12px 6px; display: flex; flex-direction: column; align-items: center; gap: 7px; min-height: 44px; box-shadow: 0 1px 3px rgba(46,40,35,0.05);">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#DB2777" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="14" rx="3"/><path d="M4 10h16M7 21v-2M17 21v-2"/></svg>
        <div style="font-size: 10px; color: #6E635A; text-align: center; line-height: 1.2;">Bus</div>
      </div>
    </div>
  </div>

  <!-- Pill tab bar floating on the cream -->
  <div style="padding: 0 18px 20px 18px;">
    <div style="background: #FFFFFF; border-radius: 24px; padding: 7px; display: flex; box-shadow: 0 3px 14px rgba(46,40,35,0.09);">
      <div style="flex: 1; min-height: 46px; border-radius: 18px; background: #2E2823; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8l9-5 9 5-9 5z"/><path d="M6 11v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5"/></svg>
        <div style="font-size: 9.5px; color: #FFFFFF; font-weight: 500;">Learn</div>
      </div>
      <div style="flex: 1; min-height: 46px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A69A8F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <div style="font-size: 9.5px; color: #A69A8F;">Schedule</div>
      </div>
      <div style="flex: 1; min-height: 46px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A69A8F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3h8v5a4 4 0 01-8 0z"/><path d="M12 12v4M9 21h6M16 4h3v2a3 3 0 01-3 3M8 4H5v2a3 3 0 003 3"/></svg>
        <div style="font-size: 9.5px; color: #A69A8F;">Grades</div>
      </div>
      <div style="flex: 1; min-height: 46px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A69A8F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20a7.5 7.5 0 0115 0"/></svg>
        <div style="font-size: 9.5px; color: #A69A8F;">Account</div>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
