<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&family=Work+Sans:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; }
    a { color: #0B3D2E; text-decoration: none; }
    a:hover { color: #072A20; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFF9EC; font-family: 'Work Sans', 'Segoe UI', sans-serif; color: #14231C; display: flex; flex-direction: column; overflow: hidden;">

  <!-- A deep green block runs off the top edge and carries the lesson -->
  <div style="background: #0B3D2E; padding: 24px 20px 24px 20px; border-radius: 0 0 30px 30px;">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px;">
      <div style="display: flex; align-items: center; gap: 10px;">
        <div style="width: 38px; height: 38px; border-radius: 12px; background: #E8B33A; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', 'Trebuchet MS', sans-serif; font-size: 15px; font-weight: 700; color: #0B3D2E;">RK</div>
        <div>
          <div style="font-size: 14.5px; font-weight: 600; color: #FFFFFF; letter-spacing: -0.2px; line-height: 1.2;">Rawand Karwan</div>
          <div style="font-size: 11px; color: #7FA896;">Grade 11-B · 8821</div>
        </div>
      </div>
      <div style="background: #E8B33A; border-radius: 999px; padding: 5px 11px; font-size: 10.5px; font-weight: 700; color: #0B3D2E; letter-spacing: 0.3px;">12 DAYS</div>
    </div>

    <div style="font-size: 10px; letter-spacing: 1.8px; text-transform: uppercase; color: #E8B33A; font-weight: 600; margin-bottom: 9px;">Happening now</div>
    <div style="font-family: 'Bricolage Grotesque', 'Trebuchet MS', sans-serif; font-size: 30px; font-weight: 700; letter-spacing: -1px; line-height: 1.06; color: #FFFFFF; margin-bottom: 9px;">Advanced<br>Mathematics</div>
    <div style="display: flex; align-items: center; gap: 7px;">
      <div style="font-size: 12.5px; color: #9EC3B3;">Room 402</div>
      <div style="width: 3px; height: 3px; border-radius: 999px; background: #4C7A66;"></div>
      <div style="font-size: 12.5px; color: #9EC3B3;">until 09:30</div>
    </div>
  </div>

  <div style="flex: 1; overflow: hidden; padding: 16px 20px 0 20px; display: flex; flex-direction: column; gap: 14px;">

    <!-- Two colour-blocked figures, no cards, no borders -->
    <div style="display: flex; gap: 11px;">
      <div style="flex: 1; background: #E8B33A; border-radius: 20px; padding: 15px 16px 17px 16px;">
        <div style="font-size: 10px; letter-spacing: 1.4px; text-transform: uppercase; font-weight: 700; color: #6B4E07; margin-bottom: 9px;">Attendance</div>
        <div style="display: flex; align-items: baseline; gap: 2px;">
          <span style="font-family: 'Bricolage Grotesque', 'Trebuchet MS', sans-serif; font-size: 33px; font-weight: 800; letter-spacing: -1.6px; line-height: 0.9; color: #3D2C00;">92</span>
          <span style="font-size: 15px; font-weight: 700; color: #6B4E07;">%</span>
        </div>
      </div>
      <div style="flex: 1; background: #E85A4F; border-radius: 20px; padding: 15px 16px 17px 16px;">
        <div style="font-size: 10px; letter-spacing: 1.4px; text-transform: uppercase; font-weight: 700; color: #FFE1DE; margin-bottom: 9px;">GPA</div>
        <div style="font-family: 'Bricolage Grotesque', 'Trebuchet MS', sans-serif; font-size: 33px; font-weight: 800; letter-spacing: -1.6px; line-height: 0.9; color: #FFFFFF;">3.85</div>
      </div>
    </div>

    <!-- Assignments: a heavy left bar carries the urgency -->
    <div>
      <div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px;">
        <div style="font-family: 'Bricolage Grotesque', 'Trebuchet MS', sans-serif; font-size: 16px; font-weight: 700; letter-spacing: -0.4px;">Due soon</div>
        <div style="font-size: 11.5px; font-weight: 600; color: #E85A4F;">2 open</div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 9px;">
        <div style="display: flex; min-height: 44px; border-radius: 16px; overflow: hidden; background: #FFFFFF;">
          <div style="width: 6px; background: #E85A4F; flex-shrink: 0;"></div>
          <div style="flex: 1; padding: 13px 14px;">
            <div style="font-size: 14.5px; font-weight: 600; letter-spacing: -0.2px; margin-bottom: 3px;">Chemistry Lab Report</div>
            <div style="font-size: 11.5px; font-weight: 600; color: #E85A4F;">Due today · 23:59</div>
          </div>
        </div>
        <div style="display: flex; min-height: 44px; border-radius: 16px; overflow: hidden; background: #FFFFFF;">
          <div style="width: 6px; background: #0B3D2E; flex-shrink: 0;"></div>
          <div style="flex: 1; padding: 13px 14px;">
            <div style="font-size: 14.5px; font-weight: 600; letter-spacing: -0.2px; margin-bottom: 3px;">Digital Art Portfolio</div>
            <div style="font-size: 11.5px; color: #6B7A73;">Wednesday · 10:00</div>
          </div>
        </div>
      </div>
    </div>

    <div style="flex: 1;"></div>

    <!-- Quick links as flat blocks in the palette -->
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; padding-bottom: 14px;">
      <div style="background: #0B3D2E; border-radius: 16px; padding: 13px 14px; display: flex; align-items: center; gap: 10px; min-height: 44px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E8B33A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5A2.5 2.5 0 016.5 2H20v20H6.5A2.5 2.5 0 014 19.5z"/><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/></svg>
        <div style="font-size: 12.5px; font-weight: 600; color: #FFFFFF;">Library</div>
      </div>
      <div style="background: #14231C; border-radius: 16px; padding: 13px 14px; display: flex; align-items: center; gap: 10px; min-height: 44px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E8B33A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <div style="font-size: 12.5px; font-weight: 600; color: #FFFFFF;">Exams</div>
      </div>
      <div style="background: #14231C; border-radius: 16px; padding: 13px 14px; display: flex; align-items: center; gap: 10px; min-height: 44px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E8B33A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 01-9 8.4L3 21l1.1-9A8.4 8.4 0 1121 11.5z"/></svg>
        <div style="font-size: 12.5px; font-weight: 600; color: #FFFFFF;">Student Hub</div>
      </div>
      <div style="background: #0B3D2E; border-radius: 16px; padding: 13px 14px; display: flex; align-items: center; gap: 10px; min-height: 44px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E8B33A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="14" rx="2.5"/><path d="M4 10h16M7 21v-2M17 21v-2"/></svg>
        <div style="font-size: 12.5px; font-weight: 600; color: #FFFFFF;">Bus</div>
      </div>
    </div>
  </div>

  <!-- Tab bar as a solid green block, the active tab a gold pill -->
  <div style="background: #0B3D2E; padding: 9px 14px 16px 14px; display: flex; gap: 4px;">
    <div style="flex: 1; min-height: 46px; border-radius: 14px; background: #E8B33A; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#0B3D2E" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8l9-5 9 5-9 5z"/><path d="M6 11v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5"/></svg>
      <div style="font-size: 9.5px; font-weight: 700; color: #0B3D2E; letter-spacing: 0.2px;">LEARN</div>
    </div>
    <div style="flex: 1; min-height: 46px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#7FA896" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <div style="font-size: 9.5px; font-weight: 600; color: #7FA896; letter-spacing: 0.2px;">SCHEDULE</div>
    </div>
    <div style="flex: 1; min-height: 46px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#7FA896" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3h8v5a4 4 0 01-8 0z"/><path d="M12 12v4M9 21h6M16 4h3v2a3 3 0 01-3 3M8 4H5v2a3 3 0 003 3"/></svg>
      <div style="font-size: 9.5px; font-weight: 600; color: #7FA896; letter-spacing: 0.2px;">GRADES</div>
    </div>
    <div style="flex: 1; min-height: 46px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#7FA896" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20a7.5 7.5 0 0115 0"/></svg>
      <div style="font-size: 9.5px; font-weight: 600; color: #7FA896; letter-spacing: 0.2px;">ACCOUNT</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
